{% import "macros/breadcrumb.html" as breadcrumb %}
{% extends "base.html" %}
{% block content %}
<div class="block">
    <h2 class="title">Taxonomy: {{term.name}}</h2>
    <ul>
        {% for entry in term.pages %}
        <li>
            <a href="{{entry.path}}">{{entry.title}}</a>
        </li>
        {% endfor %}
    </ul>
</div>
{% endblock content %}
